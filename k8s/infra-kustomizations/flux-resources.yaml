---
# Stage 2: custom resources that require their operator/CRDs to exist first.
# Each entry `dependsOn` the matching stage-1 Kustomization from
# flux-releases.yaml.
#
# `wait: true` is intentionally only set on cert-manager-resources (whose
# Certificate/ClusterIssuer health Flux can assess). The other CRs (Gateway API,
# NodeFeatureRule, PodMonitor, ...) have no kstatus-compatible readiness, so
# waiting on them would just hit the timeout.

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-resources
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m0s
  timeout: 5m0s
  wait: true
  path: ./k8s/infrastructure/cert-manager/resources
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager-operators

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
