---
# Stage 1: namespaces, HelmRepositories and HelmReleases for every component.
# `wait: true` makes each Kustomization Ready only once its HelmReleases are
# reconciled, so the stage-2 `dependsOn` in flux-resources.yaml actually gates
# on operator/CRD readiness instead of just on the manifests being applied.
#
# NOTE: the `-operators` suffix is legacy naming (not every component is an
# operator). Names are kept stable on purpose: renaming a Flux Kustomization
# prunes its inventory, which would uninstall the underlying Helm releases.

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-operators
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m0s
  timeout: 5m0s
  wait: true
  path: ./k8s/infrastructure/cert-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-operators
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m0s
  timeout: 5m0s
  wait: true
  path: ./k8s/infrastructure/external-dns
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # external-dns watches Gateway API resources, so the CRDs must exist first.
  dependsOn:
    - name: envoy-gateway-operators

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
