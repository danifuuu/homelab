---
# Flux Kustomizations for Operators/Charts/CRDs
# These are applied first and establish the foundation for custom resources
# See flux-resources-kustomizations.yaml for the second stage

---
# Cert-Manager Operators
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-operators
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s/infrastructure/cert-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system

---
