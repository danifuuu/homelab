apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The flux-system Kustomization reconciles this root. The files below contain
# Flux Kustomization CRs, one per component, split into two stages:
# - flux-releases.yaml: namespaces, HelmRepositories, HelmReleases
# - flux-resources.yaml: CRs that dependOn the release stage
resources:
  - infra-kustomizations/flux-releases.yaml
  - infra-kustomizations/flux-resources.yaml
  - services-kustomizations/flux-releases.yaml
