apiVersion: apps/v1
kind: Deployment
metadata:
  name: opengym
  namespace: opengym
  labels:
    app: opengym
spec:
  # The API keeps everything in JSON files on a ReadWriteOnce volume, so two
  # replicas (or a rolling update) must never write them at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opengym
  template:
    metadata:
      labels:
        app: opengym
    spec:
      # Pin to the worker node, like the rest of the workload.
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      initContainers:
        # Exercise images and GIFs, downloaded once (~140 MB). They are (c) Gym visual,
        # used under the exercises-dataset's terms and fetched from upstream, not
        # redistributed by openGym; see the openGym NOTICE.md.
        - name: media-download
          image: alpine/git:2.52.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /out/img /out/gif
              if [ -z "$(ls -A /out/img 2>/dev/null)" ]; then
                git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
                cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
              fi
          volumeMounts:
            - name: opengym-media
              mountPath: /out
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
      containers:
        - name: api
          # Pin the API and web images to one release and move them together; a restarted
          # pod should never come back on a version that was not chosen.
          image: ghcr.io/duartesantos8/opengym-api:1.3.9
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: /data
            # Passkeys are bound to this exact hostname and browsers only allow them over
            # HTTPS. The public Tailscale Funnel URL is the canonical origin: it is fronted
            # by a browser-trusted Let's Encrypt certificate for opengym.<tailnet>.ts.net.
            # Replace <tailnet> with the tailnet DNS name from the Tailscale admin console.
            # PASSWORD_LOGIN stays on as a fallback for devices that cannot use a passkey.
            - name: RP_ID
              value: opengym.<tailnet>.ts.net
            - name: ORIGIN
              value: https://opengym.<tailnet>.ts.net
            - name: PASSWORD_LOGIN
              value: "1"
            # The Funnel URL is reachable from the public internet, so require an
            # invite code before a new profile can be created. Existing accounts
            # keep working.
            - name: INVITE_ONLY
              value: "1"
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
          volumeMounts:
            - name: opengym-data
              mountPath: /data
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: web
          image: ghcr.io/duartesantos8/opengym-web:1.3.9
          imagePullPolicy: IfNotPresent
          env:
            - name: NGINX_PORT
              value: "80"
            # Both containers share the pod network, so the API is on localhost.
            - name: BACKEND
              value: 127.0.0.1
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 80
              name: web
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
          volumeMounts:
            - name: opengym-media
              mountPath: /usr/share/nginx/html/img
              subPath: img
            - name: opengym-media
              mountPath: /usr/share/nginx/html/gif
              subPath: gif
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: opengym-data
          persistentVolumeClaim:
            claimName: opengym-data
        - name: opengym-media
          persistentVolumeClaim:
            claimName: opengym-media
