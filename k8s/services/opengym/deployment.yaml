apiVersion: apps/v1
kind: Deployment
metadata:
  name: opengym
  namespace: opengym
  labels:
    app: opengym
spec:
  # The API keeps everything in JSON files on a ReadWriteOnce volume, so two
  # replicas (or a rolling update) must never write them at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opengym
  template:
    metadata:
      labels:
        app: opengym
    spec:
      # Pin to the worker node, like the rest of the workload.
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      initContainers:
        # openGym hard-codes MAX_OUTPUT_TOKENS = 16000 in api/coach/core/adapters/http.js.
        # Reasoning models count their hidden thinking against it: DeepSeek spends ~12k of that
        # before the plan, so a normal create uses ~15k of the 16k cap and intermittently fails
        # with "the answer was cut off at the output limit". Raise the cap in a copy of the
        # adapter, derived from the image itself so it survives image bumps; if upstream ever
        # changes the constant the substitution stops matching and the upstream value stands.
        - name: coach-output-cap
          image: ghcr.io/duartesantos8/opengym-api:1.3.9
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - sed 's/MAX_OUTPUT_TOKENS = 16000/MAX_OUTPUT_TOKENS = 65536/' /app/coach/core/adapters/http.js > /patch/http.js
          volumeMounts:
            - name: coach-output-cap
              mountPath: /patch
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
        # Exercise images and GIFs, downloaded once (~140 MB). They are (c) Gym visual,
        # used under the exercises-dataset's terms and fetched from upstream, not
        # redistributed by openGym; see the openGym NOTICE.md.
        - name: media-download
          image: alpine/git:v2.54.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /out/img /out/gif
              if [ -z "$(ls -A /out/img 2>/dev/null)" ]; then
                git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
                cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
              fi
          volumeMounts:
            - name: opengym-media
              mountPath: /out
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
      containers:
        - name: api
          # Pin the API and web images to one release and move them together; a restarted
          # pod should never come back on a version that was not chosen.
          image: ghcr.io/duartesantos8/opengym-api:1.3.9
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: /data
            # Passkeys are bound to this exact hostname and browsers only allow them over
            # HTTPS. The public Tailscale Funnel URL is the canonical origin: it is fronted
            # by a browser-trusted Let's Encrypt certificate for opengym.tailcac74e.ts.net.
            # PASSWORD_LOGIN stays on as a fallback for devices that cannot use a passkey.
            - name: RP_ID
              value: opengym.tailcac74e.ts.net
            - name: ORIGIN
              value: https://opengym.tailcac74e.ts.net
            - name: PASSWORD_LOGIN
              value: "1"
            # Admin accounts get the dashboard that mints invite codes. The owner's
            # account id lives in data/db.json (users[].id) / Settings -> Account.
            - name: ADMIN_UIDS
              value: NJ4t0EbPfVhRsWxE
            # New profiles now require an invite code from the admin dashboard.
            # Existing accounts (including this admin) keep working.
            - name: INVITE_ONLY
              value: "1"
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
          volumeMounts:
            - name: opengym-data
              mountPath: /data
            # The raised-cap copy of the HTTP adapter, written by the coach-output-cap init
            # container. subPath overlays just this one file; the rest of the image is untouched.
            - name: coach-output-cap
              mountPath: /app/coach/core/adapters/http.js
              subPath: http.js
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: web
          image: ghcr.io/duartesantos8/opengym-web:1.3.9
          imagePullPolicy: IfNotPresent
          env:
            - name: NGINX_PORT
              value: "80"
            # Both containers share the pod network, so the API is on localhost.
            - name: BACKEND
              value: 127.0.0.1
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 80
              name: web
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
          volumeMounts:
            - name: opengym-media
              mountPath: /usr/share/nginx/html/img
              subPath: img
            - name: opengym-media
              mountPath: /usr/share/nginx/html/gif
              subPath: gif
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: opengym-data
          persistentVolumeClaim:
            claimName: opengym-data
        - name: opengym-media
          persistentVolumeClaim:
            claimName: opengym-media
        - name: coach-output-cap
          emptyDir: {}
