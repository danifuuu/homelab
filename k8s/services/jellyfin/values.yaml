persistence:
  config:
    size: 50Gi # Increased size to store logs/metadata
  media:
    accessMode: ReadWriteMany

# finally! adding gpu support for hardware acceleration of transcoding tasks
resources:
  limits:
    gpu.intel.com/i915: 1

metrics:
  enabled: true 
  serviceMonitor:
    enabled: true
    interval: 60s

nodeSelector:
  node-role.kubernetes.io/worker: ""

