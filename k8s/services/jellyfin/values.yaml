persistence:
  config:
    # The .strm catalog is ~6.9k titles and Jellyfin pulls artwork for all of
    # them; this volume reached 87% (43G/49G). Longhorn allows expansion, so
    # grow it rather than break SQLite.
    size: 80Gi
  media:
    # Only Jellyfin and the m3uparser CronJob (pinned to the worker) mount
    # this, and both run on the same node. RWO removes the NFS share-manager
    # (~177Mi) and its extra hop.
    accessMode: ReadWriteOnce

# finally! adding gpu support for hardware acceleration of transcoding tasks
resources:
  requests:
    # 24h peaks are ~180m CPU and ~456Mi; request generously so the scheduler
    # accounts for it and Jellyfin is not an early eviction candidate.
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi
    gpu.intel.com/i915: 1

metrics:
  enabled: true 
  serviceMonitor:
    enabled: true
    interval: 60s

nodeSelector:
  node-role.kubernetes.io/worker: ""

# deploymentStrategy:
#   type: Recreate

httpRoute:
  enabled: true
  parentRefs:
    - name: homelab-gateway
      namespace: default
  hostnames:
    - "jellyfin.homelab.home.arpa"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jellyfin
          port: 8096


startupProbe:
  initialDelaySeconds: 30
  periodSeconds: 20
  failureThreshold: 60

livenessProbe:
  initialDelaySeconds: 120
  timeoutSeconds: 5
  failureThreshold: 60

readinessProbe:
  initialDelaySeconds: 30
  timeoutSeconds: 5
