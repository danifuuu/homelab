apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 1h
  chart:
    spec:
      chart: jellyfin
      version: 3.2.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: jellyfin
  # values:
  #   httpRoute:
  #     enabled: true
  #     parentRefs:
  #       - name: homelab-gateway
  #         namespace: default
  #     hostnames:
  #       - jellyfin.homelab.home.arpa
  valuesFrom:
    - kind: ConfigMap
      name: jellyfin-values
      valuesKey: values.yaml
