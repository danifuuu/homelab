apiVersion: batch/v1
kind: CronJob
metadata:
  name: m3uparser-job
  namespace: jellyfin
spec:
  schedule: "0 */12 * * *"  # Every 12 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: m3uparser
        spec:
          restartPolicy: Never
          containers:
            - name: m3uparser
              image: danifuu/m3uparser:go-latest
              envFrom:
                - secretRef:
                    name: jellyfin-secret
              env:
                # Telegram bot webhook — set TELEGRAM_WEBHOOK_URL and
                # TELEGRAM_WEBHOOK_SECRET in jellyfin-secret to enable notifications.
                - name: TELEGRAM_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: jellyfin-secret
                      key: TELEGRAM_WEBHOOK_URL
                      optional: true
                - name: TELEGRAM_WEBHOOK_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: jellyfin-secret
                      key: TELEGRAM_WEBHOOK_SECRET
                      optional: true
              volumeMounts:
              - mountPath: /data/VODS
                name: media
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: jellyfin-media
