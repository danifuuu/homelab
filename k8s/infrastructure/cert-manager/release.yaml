apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: cert-manager
  values:
    crds:
      enabled: true
    # All three controllers were BestEffort (no requests at all), so they were
    # first in line for eviction. Sized against observed peaks (controller
    # 48Mi, webhook 36Mi, cainjector 44Mi).
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 96Mi
    webhook:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 96Mi
    cainjector:
      resources:
        requests:
          cpu: 5m
          memory: 48Mi
        limits:
          memory: 128Mi
