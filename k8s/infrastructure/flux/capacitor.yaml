---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: capacitor
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/gimlet-io/charts/capacitor-next
  ref:
    tag: "0.14.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capacitor
  namespace: flux-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: capacitor
    namespace: flux-system
  values:
    env:
      AZURE_WORKLOAD_IDENTITY_ENABLED: "false"
