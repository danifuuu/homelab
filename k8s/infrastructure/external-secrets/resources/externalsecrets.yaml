---
# Each remoteRef.key is the NAME of a secret in the configured Bitwarden project.
# Create one Bitwarden secret per entry, named "<namespace>/<KEY>" by convention.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adguard-configuration
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: adguard-configuration
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: external-dns/url
    - secretKey: user
      remoteRef:
        key: external-dns/user
    - secretKey: password
      remoteRef:
        key: external-dns/password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telegram-bot-secret
  namespace: telegram-bot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: telegram-bot-secret
    creationPolicy: Owner
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: telegram-bot/TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: telegram-bot/TELEGRAM_CHAT_ID
    - secretKey: WEBHOOK_SECRET
      remoteRef:
        key: telegram-bot/WEBHOOK_SECRET

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-secret
  namespace: jellyfin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: jellyfin-secret
    creationPolicy: Owner
    # Bitwarden Secrets Manager rejects empty values, so the keys that are
    # intentionally empty are rendered here instead of being stored remotely.
    template:
      engineVersion: v2
      data:
        M3U_URL: "{{ .M3U_URL }}"
        SCRUB_HEADER: "{{ .SCRUB_HEADER }}"
        BYPASS_HEADER: "{{ .BYPASS_HEADER }}"
        RUN_ONCE: "{{ .RUN_ONCE }}"
        EXCLUDE_TERMS: ""
        REMOVE_TERMS: ""
        REPLACE_TERMS: ""
        CLEANERS: ""
        CLEAN_SYNC: "{{ .CLEAN_SYNC }}"
        LIVE_TV: "{{ .LIVE_TV }}"
        UNSORTED: ""
        JELLYFIN_URL: "{{ .JELLYFIN_URL }}"
        API_KEY: "{{ .API_KEY }}"
        TF_HOST: ""
        TF_PORT: ""
        TF_USER: ""
        TF_PASS: ""
        REFRESH_LIB: ""
        TELEGRAM_WEBHOOK_URL: "{{ .TELEGRAM_WEBHOOK_URL }}"
        TELEGRAM_WEBHOOK_SECRET: "{{ .TELEGRAM_WEBHOOK_SECRET }}"
  data:
    - secretKey: M3U_URL
      remoteRef:
        key: jellyfin/M3U_URL
    - secretKey: SCRUB_HEADER
      remoteRef:
        key: jellyfin/SCRUB_HEADER
    - secretKey: BYPASS_HEADER
      remoteRef:
        key: jellyfin/BYPASS_HEADER
    - secretKey: RUN_ONCE
      remoteRef:
        key: jellyfin/RUN_ONCE
    - secretKey: CLEAN_SYNC
      remoteRef:
        key: jellyfin/CLEAN_SYNC
    - secretKey: LIVE_TV
      remoteRef:
        key: jellyfin/LIVE_TV
    - secretKey: JELLYFIN_URL
      remoteRef:
        key: jellyfin/JELLYFIN_URL
    - secretKey: API_KEY
      remoteRef:
        key: jellyfin/API_KEY
    - secretKey: TELEGRAM_WEBHOOK_URL
      remoteRef:
        key: jellyfin/TELEGRAM_WEBHOOK_URL
    - secretKey: TELEGRAM_WEBHOOK_SECRET
      remoteRef:
        key: telegram-bot/WEBHOOK_SECRET

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring/grafana-admin-user
    - secretKey: admin-password
      remoteRef:
        key: monitoring/grafana-admin-password
