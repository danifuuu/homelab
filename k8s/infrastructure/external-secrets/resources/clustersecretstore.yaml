---
# Bitwarden Secrets Manager backend.
#
# Bootstrap prerequisite (not managed by GitOps): the machine-account access
# token must exist as a Secret before this store can connect:
#
#   kubectl -n external-secrets create secret generic bitwarden-access-token \
#     --from-literal=token=<machine-account-access-token>
#
# Replace the placeholders below with your Bitwarden organization and project IDs.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.eu
      identityURL: https://identity.bitwarden.eu
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      organizationID: "086adc25-eb68-43b6-906f-b4d90122f97c"
      projectID: "7638ec6e-cb59-4bd7-829d-b4d90124efb5"
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        key: ca.crt
        namespace: external-secrets
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            key: token
            namespace: external-secrets
