apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: 2.14.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
  # The Bitwarden SDK server cannot become Ready until its TLS secret is issued
  # in stage 2 (external-secrets-resources). Waiting here would deadlock
  # bootstrap, so skip the wait and let the pod recover once the cert exists.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    # Bitwarden Secrets Manager requires the Rust SDK sidecar, served over HTTPS.
    # Its TLS secret (bitwarden-tls-certs) is issued in
    # external-secrets/resources/sdk-server-certificate.yaml.
    bitwarden-sdk-server:
      enabled: true
      # Observed ~12Mi; was BestEffort.
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi
    # The other three components were BestEffort too. Sizes are the observed
    # peaks (external-secrets 38Mi, webhook 33Mi, cert-controller 74Mi).
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        memory: 128Mi
    webhook:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 96Mi
    certController:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 160Mi
