apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: nfd-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
  values:
    # NFD is useful but not latency-sensitive; the chart defaults reserve
    # 100m CPU on the master and 1Gi+ memory limits on the other components.
    master:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
    worker:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 128Mi
    # The garbage collector only removes labels left behind by deleted nodes.
    # The cluster has two static nodes, so it idled at ~30-70Mi for nothing.
    gc:
      enable: false
