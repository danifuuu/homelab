apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: metrics-server
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: metrics-server
  values:
    args:
      - --kubelet-insecure-tls
      - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
      # The default 15s scrape interval is aggressive for a 2-core node with a
      # slow HDD; 60s keeps `kubectl top` useful without loading the kubelet.
      - --metric-resolution=60s
      # The worker's kubelet can exceed the default 10s when Longhorn is
      # rebuilding. Give it room instead of reporting the node as unknown.
      - --kubelet-request-timeout=30s
    resources:
      # Observed ~5m / ~22Mi.
      requests:
        cpu: 20m
        memory: 48Mi
      limits:
        memory: 256Mi
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
