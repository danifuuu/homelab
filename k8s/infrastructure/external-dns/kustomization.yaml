apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-dns
resources:
  - ./namespace.yaml
  - ./repository.yaml
  - ./release.yaml
configMapGenerator:
  - name: external-dns-values
    files:
      - values.yaml
replacements:
  - source:
      kind: ConfigMap
      name: external-dns-values
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.valuesFrom[0].name
