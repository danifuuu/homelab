# Both containers were BestEffort. The main controller peaks at ~61Mi and the
# AdGuard webhook at ~10Mi.
resources:
  requests:
    cpu: 5m
    memory: 48Mi
  limits:
    memory: 128Mi

provider: 
  name: webhook
  webhook:
    image:
      repository: ghcr.io/muhlba91/external-dns-provider-adguard
      tag: v11.2.0
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
    service:
      port: 8888
    livenessProbe: 
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 10
      timeoutSeconds: 5
    readinessProbe: 
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 10
      timeoutSeconds: 5
    env:
      - name: ADGUARD_URL
        valueFrom:
          secretKeyRef:
            name: adguard-configuration
            key: url
      - name: ADGUARD_USER
        valueFrom:
          secretKeyRef:
            name: adguard-configuration
            key: user
      - name: ADGUARD_PASSWORD
        valueFrom:
          secretKeyRef:
            name: adguard-configuration
            key: password
      # debug doubled the webhook's log output, which Alloy ships to Loki on
      # the same single HDD; the per-request debug lines are not needed.
      - name: LOG_LEVEL
        value: info
      - name: DRY_RUN
        value: "false"
policy: upsert-only
extraArgs:
  - --source=service
  - --source=gateway-httproute
  - --txt-owner-id=homelab-cluster
  - --domain-filter=home.arpa

rbac:
  additionalPermissions:
    - apiGroups: ["gateway.networking.k8s.io"]
      resources: ["gateways", "httproutes"]
      verbs: ["get", "watch", "list"]
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "watch", "list"]
