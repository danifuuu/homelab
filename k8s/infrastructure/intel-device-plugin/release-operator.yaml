apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-operator
  namespace: intel-device-plugin-system
spec:
  interval: 12h
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: 0.37.1
      sourceRef:
        kind: HelmRepository
        name: intel-device-plugin
  values:
    # Chart default is 100m/100Mi, but the controller uses ~4m and ~18Mi.
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  upgrade:
    remediation:
      retries: 1
