apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  namespace: longhorn-system

# Two-stage deployment (managed by Flux):
# Stage 1: longhorn-operators (namespace, repository, release)
# Stage 2: longhorn-resources (httpRoute)

resources:
  # Stage 1: Operators
  - ./namespace.yaml
  - ./repository.yaml
  - ./release.yaml
  # Stage 2: Custom Resources
  - ./httpRoute.yaml