apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metallb
      version: 0.16.1
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: metallb-system
  values:
    # Only L2 (L2Advertisement) is in use - there is no BGPAdvertisement and no
    # FRRConfiguration. frr-k8s is the BGP backend and was running two
    # DaemonSet pods with five containers each (~250Mi total) for nothing.
    # L2 keeps working through the speaker's memberlist.
    frrk8s:
      enabled: false
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
      # The chart defaults are 10s initial delay, 3 failures and a 1s timeout,
      # with no startupProbe. On a loaded node the controller needs >40s to
      # rotate its webhook certs and start serving /healthz on 17472, so it was
      # killed mid-startup (3 restarts during the first rollout). Give startup
      # ~2 minutes and a realistic per-probe timeout.
      livenessProbe:
        initialDelaySeconds: 30
        timeoutSeconds: 5
        failureThreshold: 10
      readinessProbe:
        timeoutSeconds: 5
        failureThreshold: 6
    speaker:
      # cp-01 carries node.kubernetes.io/exclude-from-external-load-balancers
      # and the Gateway/Envoy proxy is pinned to the worker, so the control
      # plane speaker never announces anything.
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
