apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 5m
  dependsOn:
    - name: kube-prometheus-stack
  chart:
    spec:
      version: "7.x"
      chart: loki
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
      interval: 60m
  values:
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    test:
      enabled: false
    # The Loki datasource is now declared in the Grafana values
    # (controllers/kube-prometheus-stack/release.yaml, grafana.datasources)
    # instead of being discovered by the Grafana sidecar.
    # Nothing writes Loki rules, so this sidecar watched for `loki_rule`
    # ConfigMaps forever at ~80Mi RSS for no benefit.
    sidecar:
      rules:
        enabled: false
    loki:
      auth_enabled: false
      serviceMonitor:
        enabled: true
        labels:
          app.kubernetes.io/part-of: kube-prometheus-stack
      # Single-node homelab: chunks go to the PVC already mounted at
      # /var/loki instead of a chart-bundled MinIO. Drops a StatefulSet,
      # 2x5Gi volumes and ~330Mi of RAM; an S3 endpoint bought nothing at
      # one replica.
      storage:
        type: filesystem
      limits_config:
        allow_structured_metadata: true
        retention_period: 168h # 7 days
        volume_enabled: true
      # Retention is only enforced by the compactor, and Loki 3.x refuses to
      # start with retention_enabled unless delete_request_store is set. The
      # previous config had neither, so `retention_period` above was a no-op:
      # loki_compactor_apply_retention_last_successful_run_timestamp_seconds
      # was 0 and the MinIO volumes were 98% full.
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      # https://grafana.com/docs/loki/latest/setup/install/helm/install-monolithic/
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      # Grafana's Patterns/Drilldown is not used, and during log catch-up it
      # rejected 8MB batches ("received message larger than max").
      pattern_ingester:
        enabled: false
    # No Loki recording rules exist; the ruler only adds a ring and WAL writes
    # under /var/loki/ruler-wal.
    ruler:
      enabled: false
    # Chunks now live on the singleBinary PVC (10Gi, /var/loki).
    minio:
      enabled: false
    lokiCanary:
      enabled: false
    gateway:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      # Logs are disposable: do not write a second replica of every chunk to
      # the other node's HDD.
      persistence:
        storageClass: longhorn-single
      # Loki was ~360Mi with no bounds; cap it so a log burst cannot take the
      # worker down.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    # Zero out replica counts of other deployment modes
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
