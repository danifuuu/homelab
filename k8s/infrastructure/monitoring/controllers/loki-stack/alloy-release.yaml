apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  interval: 1h
  dependsOn:
    - name: kube-prometheus-stack
  chart:
    spec:
      version: "1.7.0"
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
      interval: 60m
  values:
    # https://grafana.com/docs/alloy/latest/set-up/install/kubernetes/
    controller:
      type: daemonset

    alloy:
      mounts:
        # Mount /var/log from the host to read pod log files
        varlog: true
        # Mount /var/lib/docker/containers for docker log metadata
        dockercontainers: true

      configMap:
        content: |
          // Discover pods scheduled on the current node only
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + env("HOSTNAME")
            }
          }

          // Build log file paths and enrich with Kubernetes labels
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
            }

            rule {
              target_label = "job"
              replacement  = "integrations/kubernetes/pod-logs"
            }

            // Map pod UID + container name to the log file path on the host
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }
          }

          // Watch the log files resolved by discovery
          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
            sync_period  = "5s"
          }

          // Tail matched log files and forward to processing
          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }

          // Parse the CRI log format used by containerd/Talos:
          //   <timestamp> <stream> <flags> <log content>
          // stage.cri extracts the stream label (stdout/stderr) and
          // decodes the log line so downstream | json parsing works correctly.
          loki.process "pods" {
            forward_to = [loki.write.loki.receiver]
            stage.cri {}
          }

          // Send logs to Loki
          loki.write "loki" {
            endpoint {
              url       = "http://loki-gateway/loki/api/v1/push"
              tenant_id = "1"
            }
          }
