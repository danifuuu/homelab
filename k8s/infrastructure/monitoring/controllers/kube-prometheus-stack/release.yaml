apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  # Grafana runs SQLite migrations on the shared HDD. When Longhorn is
  # rebuilding, startup can take several minutes; the default 5m Helm
  # timeout aborts the upgrade before it finishes.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: [ "/metadata/annotations/prometheus-operator-validated" ]
        target:
          kind: PrometheusRule
  valuesFrom:
  - kind: ConfigMap
    name: flux-kube-state-metrics-config
    valuesKey: kube-state-metrics-config.yaml
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    prometheus-node-exporter:
      prometheus:
        monitor:
          relabelings:
            - action: replace
              sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: node
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    alertmanager:
      enabled: true
      # Route alerts through the chart-managed config instead of an
      # AlertmanagerConfig CR: the operator in this setup selected no CRs, and
      # a mounted credentials_file keeps the webhook token out of git.
      config:
        route:
          receiver: telegram
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
        receivers:
          - name: "null"
          - name: telegram
            webhook_configs:
              - url: http://telegram-bot.telegram-bot.svc.cluster.local/alertmanager
                send_resolved: true
                max_alerts: 10
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/alertmanager-telegram-webhook/WEBHOOK_SECRET
      alertmanagerSpec:
        nodeSelector:
          node-role.kubernetes.io/worker: ""
        replicas: 1
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        # Mounted at /etc/alertmanager/secrets/<name>; populated by the
        # ExternalSecret in k8s/infrastructure/monitoring/resources.
        secrets:
          - alertmanager-telegram-webhook
      # No persistence on purpose: silences and the notification log are
      # disposable, and a Longhorn PV would add IO to the already-saturated HDD.
    prometheus:
      prometheusSpec:
        nodeSelector:
          node-role.kubernetes.io/worker: ""
        retention: 24h
        # Prometheus uses an emptyDir (no storageSpec); cap the TSDB so a busy
        # week cannot fill /var/lib/kubelet on the node.
        retentionSize: 4GB
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        podMonitorNamespaceSelector: { }
        podMonitorSelector:
          matchLabels:
            app.kubernetes.io/component: monitoring
        # Select ALL ServiceMonitors across ALL namespaces.
        # serviceMonitorSelectorNilUsesHelmValues must be false, otherwise the
        # chart overrides the empty selector with Helm-label-based selectors and
        # ServiceMonitors created by other charts (e.g. Jellyfin) are not scraped.
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
    prometheusOperator:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
    kube-state-metrics:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
    # etcd metrics are exposed by the Talos patch on the control-plane node IP.
    # Chart defaults already set port 2381 and scheme http.
    kubeEtcd:
      enabled: true
      endpoints:
        - 192.168.1.5
    grafana:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 768Mi
      # The default probe (initialDelay 60s, 10x10s failures) kills Grafana
      # mid-migration when the HDD is busy with Longhorn rebuilds.
      livenessProbe:
        initialDelaySeconds: 120
        failureThreshold: 60
      defaultDashboardsEnabled: false
      admin:
        existingSecret: grafana-admin
      sidecar:
        # The datasources are declared statically below. The discovery sidecar
        # was a second Python container (~100Mi) watching ConfigMaps for a
        # fixed set of three datasources.
        datasources:
          enabled: false
        dashboards:
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
      # grafana chart 8.x renders `datasources` as <filename>: <file contents>
      # and mounts each key at
      # /etc/grafana/provisioning/datasources/<filename>.
      # uid: prometheus is required - dashboards/flux/cluster.json references
      # that uid directly (the other dashboards use ${DS_*} variables).
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring:9090/
              access: proxy
              isDefault: true
              jsonData:
                httpMethod: POST
                timeInterval: 30s
            - name: Alertmanager
              type: alertmanager
              uid: alertmanager
              url: http://kube-prometheus-stack-alertmanager.monitoring:9093/
              access: proxy
              jsonData:
                handleGrafanaManagedAlerts: false
                implementation: prometheus
            - name: Loki
              type: loki
              uid: loki
              url: http://loki:3100
              access: proxy
