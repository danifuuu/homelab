---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: alertmanager-telegram-webhook
    creationPolicy: Owner
  data:
    - secretKey: WEBHOOK_SECRET
      remoteRef:
        key: telegram-bot/WEBHOOK_SECRET
