---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: telegram
  namespace: monitoring
spec:
  route:
    receiver: telegram
    matchers:
      - name: alertname
        matchType: "=~"
        value: ".+"
    groupBy: [alertname, namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
  receivers:
    - name: telegram
      webhookConfigs:
        - url: http://telegram-bot.telegram-bot.svc.cluster.local/alertmanager
          sendResolved: true
          maxAlerts: 10
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: alertmanager-telegram-webhook
                key: WEBHOOK_SECRET
