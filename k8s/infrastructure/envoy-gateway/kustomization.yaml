apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  namespace: envoy-gateway-system

# Two-stage deployment (managed by Flux):
# Stage 1: envoy-gateway-operators (namespace, repository, release)
# Stage 2: envoy-gateway-resources (gatewayClass, gateway)

resources:
  # Stage 1: Operators
  - ./namespace.yaml
  - ./repository.yaml
  - ./release.yaml
  # Stage 2: Custom Resources
  - ./gatewayClass.yaml
  - ./gateway.yaml
