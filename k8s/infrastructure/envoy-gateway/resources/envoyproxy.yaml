# Envoy Gateway defaults to a 544Mi memory request for the data-plane proxy,
# while the proxy actually uses <100Mi. This EnvoyProxy is attached to the
# homelab Gateway via spec.infrastructure.parametersRef and right-sizes it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: homelab-proxy
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
