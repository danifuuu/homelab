apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# The bootstrap-generated controllers reserve 350m CPU in total but use ~35m;
# on a 2-core node that is 18% of the node held for nothing. Requests are not
# caps, so they still burst when a reconcile is heavy.
#
# NOTE: gotk-components.yaml is regenerated by `flux bootstrap`. The patch
# lives here (the documented customization point) so it survives that; if the
# bootstrap ever rewrites this file, re-add the block.
patches:
  - target:
      kind: Deployment
      namespace: flux-system
      name: "(helm-controller|kustomize-controller|notification-controller|source-controller)"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 20m
